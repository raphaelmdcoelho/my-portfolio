<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Vague versus structured prompts</title><desc id="desc">A confused robot receives “Make it good.” A smiling robot receives a role, task, and output format.</desc><rect width="800" height="440" rx="24" fill="#111111"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="32" y="43" font-size="24" fill="#e5e5e5" text-anchor="start">SAME ROBOT. BETTER INSTRUCTIONS.</text><rect x="24" y="66" width="364" height="348" rx="14" fill="#191919" stroke="#2a2a2a" stroke-width="2"/><rect x="412" y="66" width="364" height="348" rx="14" fill="#191919" stroke="#2a2a2a" stroke-width="2"/><text x="48" y="98" font-size="18" fill="#ff6b6b" text-anchor="start">VAGUE PROMPT</text><text x="436" y="98" font-size="18" fill="#00ffe0" text-anchor="start">STRUCTURED PROMPT</text><rect x="48" y="116" width="316" height="62" rx="14" fill="#251c1c" stroke="#ff6b6b" stroke-width="2"/><text x="66" y="153" font-size="20" fill="#e5e5e5" text-anchor="start">“Make it good.”</text><rect x="436" y="116" width="316" height="100" rx="14" fill="#152320" stroke="#00ffe0" stroke-width="2"/><text x="452" y="142" font-size="15" fill="#e5e5e5" text-anchor="start">ROLE: editor</text><text x="452" y="169" font-size="15" fill="#e5e5e5" text-anchor="start">TASK: shorten this draft</text><text x="452" y="196" font-size="15" fill="#e5e5e5" text-anchor="start">OUTPUT: 3 clear bullets</text><g transform="translate(164 218) scale(1)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><path d="M24 32l12 12m0-12L24 44m40-12 12 12m0-12L64 44" fill="none" stroke="#ff6b6b" stroke-width="4"/></g><path d="M32 70l12-9 12 9 12-9" fill="none" stroke="#ff6b6b" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><text x="111" y="206" font-size="15" fill="#ffd166" text-anchor="start">GOOD... AT WHAT?</text><text x="71" y="384" font-size="15" fill="#888888" text-anchor="start">404: mind reading offline</text><g transform="translate(548 239) scale(1)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><circle cx="30" cy="38" r="6"/><circle cx="70" cy="38" r="6"/></g><path d="M32 59q18 21 36 0" fill="none" stroke="#00ffe0" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><text x="436" y="384" font-size="15" fill="#00ffe0" text-anchor="start">✓ A brief I can work with.</text></g></svg>