<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
  <title id="t">Vague prompt versus structured prompt</title>
  <desc id="d">A confused robot receives a vague request and produces chaos, while a happy robot receives a structured request and produces a tidy checklist.</desc>
  <defs>
    <g id="bot">
      <line x1="0" y1="-32" x2="0" y2="-50" stroke="#888" stroke-width="3"/>
      <circle cx="0" cy="-55" r="6" fill="#00ffe0"/>
      <rect x="-50" y="-8" width="10" height="24" rx="4" fill="#00ffe0"/>
      <rect x="40" y="-8" width="10" height="24" rx="4" fill="#00ffe0"/>
      <rect x="-40" y="-32" width="80" height="64" rx="14" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
      <rect x="-30" y="38" width="60" height="50" rx="10" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
      <circle cx="0" cy="62" r="6" fill="#00ffe0" opacity="0.5"/>
    </g>
  </defs>

  <rect width="800" height="440" rx="18" fill="#111111"/>
  <line x1="400" y1="24" x2="400" y2="416" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- ============ LEFT: vague ============ -->
  <text x="30" y="46" font-family="JetBrains Mono, Fira Code, monospace" font-size="15" fill="#ff6b6b">// before: vibes only</text>

  <!-- user bubble -->
  <rect x="30" y="64" width="340" height="62" rx="14" fill="#241616" stroke="#ff6b6b" stroke-width="2"/>
  <path d="M170 126 l14 20 l14 -20 z" fill="#241616" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="171" y="122" width="26" height="6" fill="#241616"/>
  <text x="200" y="91" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#e5e5e5">"Make it better, you know,</text>
  <text x="200" y="111" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#e5e5e5">the thing. But shorter. Longer?"</text>

  <!-- confused bot -->
  <g transform="translate(200 238)">
    <use href="#bot"/>
    <circle cx="-14" cy="-8" r="11" fill="#e5e5e5"/><circle cx="-12" cy="-6" r="4" fill="#111"/>
    <circle cx="16" cy="-8" r="6" fill="#e5e5e5"/><circle cx="17" cy="-9" r="2.5" fill="#111"/>
    <path d="M-16 16 q6 -8 10 0 t10 0 t10 0" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <text x="-72" y="-42" font-family="JetBrains Mono, monospace" font-size="30" font-weight="700" fill="#ffd166">?</text>
    <text x="58" y="-56" font-family="JetBrains Mono, monospace" font-size="38" font-weight="700" fill="#ffd166">?</text>
    <text x="74" y="-14" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#ffd166">?</text>
    <path d="M-30 52 q-26 4 -30 24" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 52 q26 -14 34 -34" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- chaotic output -->
  <g font-family="JetBrains Mono, monospace" font-size="13">
    <g transform="rotate(-8 90 360)"><rect x="40" y="342" width="110" height="34" rx="6" fill="#2a2a2a" stroke="#888"/><text x="52" y="364" fill="#ffd166">a poem?</text></g>
    <g transform="rotate(6 230 380)"><rect x="170" y="362" width="120" height="34" rx="6" fill="#2a2a2a" stroke="#888"/><text x="182" y="384" fill="#ff6b6b">{ json?? }</text></g>
    <g transform="rotate(-4 330 340)"><rect x="268" y="318" width="104" height="34" rx="6" fill="#2a2a2a" stroke="#888"/><text x="280" y="340" fill="#e5e5e5">5 pages</text></g>
    <g transform="rotate(12 100 322)"><rect x="42" y="304" width="100" height="30" rx="6" fill="#2a2a2a" stroke="#888"/><text x="54" y="324" fill="#e5e5e5">emoji!!</text></g>
  </g>

  <!-- ============ RIGHT: structured ============ -->
  <text x="430" y="46" font-family="JetBrains Mono, Fira Code, monospace" font-size="15" fill="#00ffe0">// after: structure</text>

  <!-- structured user prompt -->
  <rect x="430" y="64" width="340" height="82" rx="14" fill="#10201f" stroke="#00ffe0" stroke-width="2"/>
  <path d="M570 146 l14 20 l14 -20 z" fill="#10201f" stroke="#00ffe0" stroke-width="2" stroke-linejoin="round"/>
  <rect x="571" y="142" width="26" height="6" fill="#10201f"/>
  <g font-family="JetBrains Mono, monospace" font-size="13.5">
    <text x="448" y="88" fill="#00ffe0">&lt;task&gt;<tspan fill="#e5e5e5"> shorten the intro </tspan>&lt;/task&gt;</text>
    <text x="448" y="108" fill="#00ffe0">&lt;limit&gt;<tspan fill="#e5e5e5"> 3 sentences </tspan>&lt;/limit&gt;</text>
    <text x="448" y="128" fill="#00ffe0">&lt;format&gt;<tspan fill="#e5e5e5"> plain text </tspan>&lt;/format&gt;</text>
  </g>

  <!-- happy bot -->
  <g transform="translate(600 258)">
    <use href="#bot"/>
    <path d="M-22 -8 q8 -12 16 0" fill="none" stroke="#e5e5e5" stroke-width="4" stroke-linecap="round"/>
    <path d="M6 -8 q8 -12 16 0" fill="none" stroke="#e5e5e5" stroke-width="4" stroke-linecap="round"/>
    <path d="M-16 10 q16 18 32 0" fill="none" stroke="#00ffe0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-28" cy="8" r="5" fill="#ff6b6b" opacity="0.5"/><circle cx="28" cy="8" r="5" fill="#ff6b6b" opacity="0.5"/>
    <path d="M-30 52 q-30 10 -34 -16" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 52 q30 10 34 -16" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- tidy checklist output -->
  <g font-family="JetBrains Mono, monospace" font-size="14">
    <rect x="470" y="350" width="260" height="66" rx="10" fill="#1c1c1c" stroke="#00ffe0" stroke-width="2"/>
    <path d="M488 368 l6 6 l12 -13" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="518" y="372" fill="#e5e5e5">3 sentences</text>
    <path d="M488 394 l6 6 l12 -13" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="518" y="398" fill="#e5e5e5">plain text, no surprises</text>
  </g>
  <g transform="translate(724 338)">
    <path d="M0 -14 l4 10 l10 1 l-8 7 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -7 l10 -1 z" fill="#ffd166"/>
  </g>
</svg>
