<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">A prompt is an order ticket</title><desc id="desc">A vague shout produces a boot in a soup bowl. A specific order ticket gives a robot chef enough information to serve noodles.</desc><rect width="800" height="440" rx="24" fill="#111111"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="32" y="43" font-size="24" fill="#e5e5e5" text-anchor="start">YOUR PROMPT IS THE ORDER TICKET.</text><rect x="24" y="66" width="364" height="348" rx="14" fill="#191919" stroke="#2a2a2a" stroke-width="2"/><rect x="412" y="66" width="364" height="348" rx="14" fill="#191919" stroke="#2a2a2a" stroke-width="2"/><text x="48" y="98" font-size="17" fill="#ff6b6b" text-anchor="start">SHOUTING AT THE KITCHEN</text><text x="436" y="98" font-size="17" fill="#00ffe0" text-anchor="start">SENDING AN ORDER</text><text x="48" y="135" font-size="17" fill="#ffd166" text-anchor="start">“FOOD! SOMETHING NICE!”</text><g transform="translate(72 177) scale(0.8)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><path d="M24 32l12 12m0-12L24 44m40-12 12 12m0-12L64 44" fill="none" stroke="#ff6b6b" stroke-width="4"/></g><path d="M32 70l12-9 12 9 12-9" fill="none" stroke="#ff6b6b" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><ellipse cx="272" cy="315" rx="76" ry="19" fill="#888888"/><path d="M202 312h140q-12 45-70 45t-70-45" fill="#283638" stroke="#00ffe0" stroke-width="2"/><path d="M249 237h36v47l31 12v17h-76v-26h9z" fill="#ffd166" stroke="#111" stroke-width="3"/><text x="215" y="378" font-size="16" fill="#ff6b6b" text-anchor="start">Boot soup.</text><text x="48" y="398" font-size="14" fill="#888888" text-anchor="start">Chef guessed. Badly.</text><rect x="436" y="118" width="169" height="118" rx="14" fill="#202420" stroke="#00ffe0" stroke-width="2"/><text x="450" y="145" font-size="16" fill="#ffd166" text-anchor="start">ORDER #042</text><text x="450" y="171" font-size="14" fill="#e5e5e5" text-anchor="start">1 noodle bowl</text><text x="450" y="195" font-size="14" fill="#e5e5e5" text-anchor="start">No peanuts</text><text x="450" y="219" font-size="14" fill="#e5e5e5" text-anchor="start">Serve hot</text><g transform="translate(643 161) scale(0.8)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><circle cx="30" cy="38" r="6"/><circle cx="70" cy="38" r="6"/></g><path d="M32 59q18 21 36 0" fill="none" stroke="#00ffe0" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><ellipse cx="583" cy="315" rx="85" ry="23" fill="#888888"/><path d="M503 311h160q-14 49-80 49t-80-49" fill="#1b3934" stroke="#00ffe0" stroke-width="2"/><g fill="none" stroke="#ffd166" stroke-width="5"><path d="M524 309q15-25 30 0t30 0 30 0 30 0"/><path d="M531 299q15-25 30 0t30 0 30 0"/></g><path d="M563 280q-12-12 0-24m22 24q-12-12 0-24" fill="none" stroke="#888" stroke-width="3"/><text x="453" y="398" font-size="15" fill="#00ffe0" text-anchor="start">Specifics beat telepathy.</text></g></svg>