<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">One giant prompt versus a prompt chain</title><desc id="desc">A sweating robot juggles facts, logic, and prose. Three happy robots on an assembly line extract facts, analyze meaning, and write an answer.</desc><rect width="800" height="440" rx="24" fill="#111111"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="32" y="43" font-size="24" fill="#e5e5e5" text-anchor="start">BIG TASK? GIVE IT A WORKFLOW.</text><rect x="24" y="66" width="286" height="348" rx="14" fill="#191919" stroke="#2a2a2a" stroke-width="2"/><rect x="330" y="66" width="446" height="348" rx="14" fill="#191919" stroke="#2a2a2a" stroke-width="2"/><text x="44" y="98" font-size="18" fill="#ff6b6b" text-anchor="start">ONE GIANT PROMPT</text><text x="350" y="98" font-size="18" fill="#00ffe0" text-anchor="start">A PROMPT CHAIN</text><g transform="translate(119 225) scale(0.85)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><path d="M24 32l12 12m0-12L24 44m40-12 12 12m0-12L64 44" fill="none" stroke="#ff6b6b" stroke-width="4"/></g><path d="M32 70l12-9 12 9 12-9" fill="none" stroke="#ff6b6b" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><path d="M113 285Q25 170 119 155m78 130q96-115-2-130" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="5 5"/><path d="M218 219q20 25 0 25t0-25" fill="#00ffe0"/><rect x="47" y="161" width="87" height="33" rx="8" fill="#202020" stroke="#ffd166" stroke-width="2"/><text x="90" y="183" font-size="14" fill="#ffd166" text-anchor="middle">FACTS</text><rect x="162" y="133" width="87" height="33" rx="8" fill="#202020" stroke="#00ffe0" stroke-width="2"/><text x="205" y="155" font-size="14" fill="#00ffe0" text-anchor="middle">LOGIC</text><rect x="181" y="186" width="87" height="33" rx="8" fill="#202020" stroke="#ff6b6b" stroke-width="2"/><text x="224" y="208" font-size="14" fill="#ff6b6b" text-anchor="middle">PROSE</text><text x="44" y="382" font-size="14" fill="#888888" text-anchor="start">“I also juggle deadlines.”</text><text x="408" y="145" font-size="22" fill="#ffd166" text-anchor="middle">01</text><rect x="348" y="169" width="120" height="157" rx="14" fill="#172320" stroke="#00ffe0" stroke-width="2"/><g transform="translate(383 188) scale(0.5)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><circle cx="30" cy="38" r="6"/><circle cx="70" cy="38" r="6"/></g><path d="M32 59q18 21 36 0" fill="none" stroke="#00ffe0" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><text x="408" y="280" font-size="15" fill="#00ffe0" text-anchor="middle">EXTRACT</text><text x="408" y="309" font-size="12" fill="#e5e5e5" text-anchor="middle">Find facts</text><text x="478" y="254" font-size="22" fill="#ffd166" text-anchor="middle">→</text><text x="549" y="145" font-size="22" fill="#ffd166" text-anchor="middle">02</text><rect x="489" y="169" width="120" height="157" rx="14" fill="#172320" stroke="#00ffe0" stroke-width="2"/><g transform="translate(524 188) scale(0.5)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><circle cx="30" cy="38" r="6"/><circle cx="70" cy="38" r="6"/></g><path d="M32 59q18 21 36 0" fill="none" stroke="#00ffe0" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><text x="549" y="280" font-size="15" fill="#00ffe0" text-anchor="middle">ANALYZE</text><text x="549" y="309" font-size="12" fill="#e5e5e5" text-anchor="middle">Find meaning</text><text x="619" y="254" font-size="22" fill="#ffd166" text-anchor="middle">→</text><text x="690" y="145" font-size="22" fill="#ffd166" text-anchor="middle">03</text><rect x="630" y="169" width="120" height="157" rx="14" fill="#172320" stroke="#00ffe0" stroke-width="2"/><g transform="translate(665 188) scale(0.5)"><path d="M50 0v16" stroke="#888" stroke-width="4"/><circle cx="50" cy="0" r="6" fill="#ffd166"/><rect x="0" y="16" width="100" height="74" rx="14" fill="#202828" stroke="#00ffe0" stroke-width="2"/><g fill="#00ffe0"><circle cx="30" cy="38" r="6"/><circle cx="70" cy="38" r="6"/></g><path d="M32 59q18 21 36 0" fill="none" stroke="#00ffe0" stroke-width="4"/><path d="M25 94v28m50-28v28M0 52h-12m112 0h12" stroke="#00ffe0" stroke-width="6" stroke-linecap="round"/></g><text x="690" y="280" font-size="15" fill="#00ffe0" text-anchor="middle">WRITE</text><text x="690" y="309" font-size="12" fill="#e5e5e5" text-anchor="middle">Draft answer</text><path d="M350 345h400" stroke="#888" stroke-width="8" stroke-linecap="round"/><circle cx="363" cy="345" r="4" fill="#111111"/><circle cx="395" cy="345" r="4" fill="#111111"/><circle cx="427" cy="345" r="4" fill="#111111"/><circle cx="459" cy="345" r="4" fill="#111111"/><circle cx="491" cy="345" r="4" fill="#111111"/><circle cx="523" cy="345" r="4" fill="#111111"/><circle cx="555" cy="345" r="4" fill="#111111"/><circle cx="587" cy="345" r="4" fill="#111111"/><circle cx="619" cy="345" r="4" fill="#111111"/><circle cx="651" cy="345" r="4" fill="#111111"/><circle cx="683" cy="345" r="4" fill="#111111"/><circle cx="715" cy="345" r="4" fill="#111111"/><circle cx="747" cy="345" r="4" fill="#111111"/><text x="350" y="382" font-size="14" fill="#888888" text-anchor="start">Inspect each handoff. Catch mistakes.</text></g></svg>