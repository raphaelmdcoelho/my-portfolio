<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
  <title id="t">One giant prompt versus a prompt chain</title>
  <desc id="d">Top: a sweating robot juggling seven tasks at once. Bottom: an assembly line where three small robots each handle one step - extract, analyze, write - and pass the result along a conveyor belt.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ffe0"/>
    </marker>
  </defs>

  <rect width="800" height="440" rx="18" fill="#111111"/>

  <!-- ===== TOP: juggler ===== -->
  <text x="30" y="42" font-family="JetBrains Mono, monospace" font-size="15" fill="#ff6b6b">// one giant prompt</text>
  <g transform="translate(400 150)">
    <!-- juggled balls -->
    <g font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#111" text-anchor="middle">
      <circle cx="-150" cy="-60" r="19" fill="#ffd166"/><text x="-150" y="-56">parse</text>
      <circle cx="-96" cy="-92" r="19" fill="#ff6b6b"/><text x="-96" y="-88">sum</text>
      <circle cx="-34" cy="-104" r="19" fill="#00ffe0"/><text x="-34" y="-100">rank</text>
      <circle cx="34" cy="-104" r="19" fill="#ffd166"/><text x="34" y="-100">tone</text>
      <circle cx="96" cy="-92" r="19" fill="#ff6b6b"/><text x="96" y="-88">JSON</text>
      <circle cx="150" cy="-60" r="19" fill="#00ffe0"/><text x="150" y="-56">cite</text>
    </g>
    <!-- arcs -->
    <g fill="none" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4 6">
      <path d="M-40 -20 Q-150 -150 -150 -60"/><path d="M40 -20 Q150 -150 150 -60"/>
    </g>
    <!-- bot -->
    <line x1="0" y1="-32" x2="0" y2="-46" stroke="#888" stroke-width="3"/>
    <circle cx="0" cy="-50" r="5" fill="#00ffe0"/>
    <rect x="-38" y="-32" width="76" height="60" rx="14" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
    <circle cx="-13" cy="-8" r="9" fill="#e5e5e5"/><circle cx="-13" cy="-6" r="4" fill="#111"/>
    <circle cx="13" cy="-8" r="9" fill="#e5e5e5"/><circle cx="13" cy="-6" r="4" fill="#111"/>
    <path d="M-14 14 h28" stroke="#ff6b6b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M42 -26 q8 8 2 18 q-8 -2 -2 -18 z" fill="#5ab0ff"/>
    <path d="M-44 -22 q-8 8 -2 18 q8 -2 2 -18 z" fill="#5ab0ff"/>
    <rect x="-28" y="34" width="56" height="26" rx="8" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
    <path d="M-28 42 q-26 -22 -28 -44" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 42 q26 -22 28 -44" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <line x1="30" y1="232" x2="770" y2="232" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- ===== BOTTOM: assembly line ===== -->
  <text x="30" y="256" font-family="JetBrains Mono, monospace" font-size="15" fill="#00ffe0">// a prompt chain</text>

  <!-- conveyor belt -->
  <rect x="30" y="392" width="740" height="14" rx="7" fill="#1c1c1c" stroke="#888" stroke-width="2"/>
  <g fill="#888"><circle cx="48" cy="399" r="3"/><circle cx="120" cy="399" r="3"/><circle cx="192" cy="399" r="3"/><circle cx="264" cy="399" r="3"/><circle cx="336" cy="399" r="3"/><circle cx="408" cy="399" r="3"/><circle cx="480" cy="399" r="3"/><circle cx="552" cy="399" r="3"/><circle cx="624" cy="399" r="3"/><circle cx="696" cy="399" r="3"/><circle cx="752" cy="399" r="3"/></g>

  <!-- stations -->
  <g font-family="JetBrains Mono, monospace" text-anchor="middle">
    <!-- 1 -->
    <g transform="translate(130 346)">
      <rect x="-34" y="-30" width="68" height="52" rx="12" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
      <path d="M-20 -8 q6 -9 12 0 M8 -8 q6 -9 12 0" fill="none" stroke="#e5e5e5" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-10 6 q10 8 20 0" fill="none" stroke="#00ffe0" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-42" stroke="#888" stroke-width="3"/><circle cx="0" cy="-45" r="4" fill="#00ffe0"/>
      <rect x="-26" y="26" width="52" height="30" rx="8" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
      <text x="0" y="-58" font-size="13" fill="#00ffe0" font-weight="700">1. extract</text>
    </g>
    <!-- 2 -->
    <g transform="translate(400 346)">
      <rect x="-34" y="-30" width="68" height="52" rx="12" fill="#1c1c1c" stroke="#ffd166" stroke-width="3"/>
      <circle cx="-13" cy="-6" r="7" fill="none" stroke="#e5e5e5" stroke-width="3"/>
      <circle cx="13" cy="-6" r="7" fill="none" stroke="#e5e5e5" stroke-width="3"/>
      <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#e5e5e5" stroke-width="3"/>
      <path d="M-9 9 h18" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-42" stroke="#888" stroke-width="3"/><circle cx="0" cy="-45" r="4" fill="#ffd166"/>
      <rect x="-26" y="26" width="52" height="30" rx="8" fill="#1c1c1c" stroke="#ffd166" stroke-width="3"/>
      <text x="0" y="-58" font-size="13" fill="#ffd166" font-weight="700">2. analyze</text>
    </g>
    <!-- 3 -->
    <g transform="translate(670 346)">
      <rect x="-34" y="-30" width="68" height="52" rx="12" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
      <path d="M-20 -8 q6 -9 12 0 M8 -8 q6 -9 12 0" fill="none" stroke="#e5e5e5" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-14 4 q14 14 28 0" fill="none" stroke="#00ffe0" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-42" stroke="#888" stroke-width="3"/><circle cx="0" cy="-45" r="4" fill="#00ffe0"/>
      <rect x="-26" y="26" width="52" height="30" rx="8" fill="#1c1c1c" stroke="#00ffe0" stroke-width="3"/>
      <path d="M34 -16 l14 -12 M34 -2 l16 0" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="-58" font-size="13" fill="#00ffe0" font-weight="700">3. write</text>
    </g>
  </g>

  <!-- hand-offs along the belt -->
  <g font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle" fill="#e5e5e5">
    <path d="M190 356 H318" stroke="#00ffe0" stroke-width="2.5" marker-end="url(#arr)" fill="none" stroke-dasharray="1 0"/>
    <rect x="210" y="328" width="88" height="24" rx="6" fill="#10201f" stroke="#00ffe0" stroke-width="1.5"/>
    <text x="254" y="345">&lt;facts&gt;</text>
    <path d="M460 356 H588" stroke="#00ffe0" stroke-width="2.5" marker-end="url(#arr)" fill="none"/>
    <rect x="480" y="328" width="88" height="24" rx="6" fill="#10201f" stroke="#00ffe0" stroke-width="1.5"/>
    <text x="524" y="345">&lt;insights&gt;</text>
  </g>
</svg>
