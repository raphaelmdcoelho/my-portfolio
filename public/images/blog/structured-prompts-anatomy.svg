<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The building blocks of a structured prompt</title><desc id="desc">Six LEGO-like bricks represent role, context, task, examples, constraints, and output format. Each brick explains the question it answers.</desc><rect width="800" height="440" rx="24" fill="#111111"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="32" y="43" font-size="23" fill="#e5e5e5" text-anchor="start">BUILD A BRIEF, ONE BRICK AT A TIME.</text><text x="32" y="74" font-size="16" fill="#888888" text-anchor="start">Snap in the pieces your task needs.</text><rect x="48" y="108" width="470" height="40" rx="6" fill="#1b2221" stroke="#00ffe0" stroke-width="2"/><rect x="76" y="101" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><rect x="124" y="101" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><rect x="172" y="101" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><text x="64" y="134" font-size="15" fill="#00ffe0" text-anchor="start">ROLE</text><text x="538" y="134" font-size="13" fill="#e5e5e5" text-anchor="start">Who should the model be?</text><rect x="48" y="157" width="470" height="40" rx="6" fill="#1b2221" stroke="#ffd166" stroke-width="2"/><rect x="76" y="150" width="25" height="7" rx="2" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><rect x="124" y="150" width="25" height="7" rx="2" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><rect x="172" y="150" width="25" height="7" rx="2" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="64" y="183" font-size="15" fill="#ffd166" text-anchor="start">CONTEXT</text><text x="538" y="183" font-size="13" fill="#e5e5e5" text-anchor="start">What should it know?</text><rect x="48" y="206" width="470" height="40" rx="6" fill="#1b2221" stroke="#00ffe0" stroke-width="2"/><rect x="76" y="199" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><rect x="124" y="199" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><rect x="172" y="199" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><text x="64" y="232" font-size="15" fill="#00ffe0" text-anchor="start">TASK</text><text x="538" y="232" font-size="13" fill="#e5e5e5" text-anchor="start">What should it do?</text><rect x="48" y="255" width="470" height="40" rx="6" fill="#1b2221" stroke="#ffd166" stroke-width="2"/><rect x="76" y="248" width="25" height="7" rx="2" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><rect x="124" y="248" width="25" height="7" rx="2" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><rect x="172" y="248" width="25" height="7" rx="2" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="64" y="281" font-size="15" fill="#ffd166" text-anchor="start">EXAMPLES</text><text x="538" y="281" font-size="13" fill="#e5e5e5" text-anchor="start">What does good look like?</text><rect x="48" y="304" width="470" height="40" rx="6" fill="#1b2221" stroke="#ff6b6b" stroke-width="2"/><rect x="76" y="297" width="25" height="7" rx="2" fill="#ff6b6b" stroke="#ff6b6b" stroke-width="2"/><rect x="124" y="297" width="25" height="7" rx="2" fill="#ff6b6b" stroke="#ff6b6b" stroke-width="2"/><rect x="172" y="297" width="25" height="7" rx="2" fill="#ff6b6b" stroke="#ff6b6b" stroke-width="2"/><text x="64" y="330" font-size="15" fill="#ff6b6b" text-anchor="start">CONSTRAINTS</text><text x="538" y="330" font-size="13" fill="#e5e5e5" text-anchor="start">What are the boundaries?</text><rect x="48" y="353" width="470" height="40" rx="6" fill="#1b2221" stroke="#00ffe0" stroke-width="2"/><rect x="76" y="346" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><rect x="124" y="346" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><rect x="172" y="346" width="25" height="7" rx="2" fill="#00ffe0" stroke="#00ffe0" stroke-width="2"/><text x="64" y="379" font-size="15" fill="#00ffe0" text-anchor="start">OUTPUT FORMAT</text><text x="538" y="379" font-size="13" fill="#e5e5e5" text-anchor="start">What shape should it return?</text><text x="48" y="423" font-size="15" fill="#888888" text-anchor="start">A reusable structure. No tiny plastic foot injuries.</text></g></svg>